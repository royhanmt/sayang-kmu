<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Love for Nia Agustin ❤️</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        #canvasBg,
        #canvasInteraction {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #canvasBg {
            z-index: 1;
        }

        #canvasInteraction {
            z-index: 2;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        /* --- Styling & Animasi Bingkai Foto --- */
        .photo-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 20px;
            position: relative;
            opacity: 0;
            transform: scale(0.5);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }

        .photo-container.show {
            opacity: 1;
            transform: scale(1);
            animation: floatPhoto 3s ease-in-out infinite alternate;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ff3366;
            box-shadow:
                0 0 15px #ff3366,
                0 0 30px #ff0055,
                inset 0 0 15px rgba(255, 51, 102, 0.5);
        }

        /* --- Styling Teks --- */
        .love-text {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #ff3366;
            text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366, 0 0 40px #ff0055;
            min-height: 90px;
            pointer-events: auto;
            animation: floating 3s ease-in-out infinite, glowing 2s infinite alternate;
        }

        .name-text {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: #ff99bb;
            text-shadow: 0 0 10px #ff99bb, 0 0 20px #ff3366, 0 0 40px #ff0055;
            min-height: 100px;
            pointer-events: auto;
            animation: floating 3s ease-in-out infinite 0.5s, glowing 2s infinite alternate 0.5s;
        }

        @keyframes floatPhoto {
            0% {
                transform: translateY(0) scale(1);
                box-shadow: 0 0 20px #ff3366;
            }

            100% {
                transform: translateY(-10px) scale(1.03);
                box-shadow: 0 0 35px #ff0055;
            }
        }

        @keyframes glowing {
            0% {
                text-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366;
            }

            100% {
                text-shadow: 0 0 20px #ff3366, 0 0 40px #ff0055, 0 0 60px #ff0055;
            }
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        /* Tombol & Modal */
        .envelope-btn {
            margin-top: 20px;
            padding: 12px 28px;
            background: rgba(255, 51, 102, 0.15);
            border: 2px solid #ff3366;
            border-radius: 50px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.3);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: auto;
        }

        .envelope-btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        .envelope-btn:hover {
            background: #ff3366;
            box-shadow: 0 0 30px #ff3366;
            transform: scale(1.08);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .modal.open {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a002c, #330033);
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            max-width: 420px;
            border: 1px solid #ff99bb;
            box-shadow: 0 0 50px rgba(255, 51, 102, 0.6);
        }

        .modal-content h3 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: #ffccd5;
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #f0e6ff;
            margin-bottom: 20px;
        }

        .close-btn {
            padding: 8px 22px;
            background: #ff3366;
            border: none;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .music-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
            transition: 0.4s;
            pointer-events: auto;
        }

        @media (max-width: 768px) {
            .photo-container {
                width: 120px;
                height: 120px;
            }

            .love-text {
                font-size: 3rem;
                min-height: 60px;
            }

            .name-text {
                font-size: 3.5rem;
                min-height: 70px;
            }
        }
    </style>
</head>

<body>

    <audio id="bg-music" loop>
        <source
            src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3"
            type="audio/mpeg">
    </audio>

    <button class="music-btn" id="musicBtn" title="Putar Musik">🎵</button>

    <canvas id="canvasBg"></canvas>
    <canvas id="canvasInteraction"></canvas>

    <div class="container">
        <!-- Bingkai Foto Nia Agustin -->
        <div class="photo-container" id="photoBox">
            <!-- Ganti src di bawah dengan URL/File foto Nia Agustin -->
            <img src="image.png" alt="Nia Agustin">
        </div>

        <h1 class="love-text" id="typewriter-love"></h1>
        <h2 class="name-text" id="typewriter-name"></h2>
        <button class="envelope-btn" id="envelopeBtn">💌 Buka Pesan Magis</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h3>Nia Agustin ❤️</h3>
            <p>Di antara miliaran bintang di langit, bagiku senyumanmu yang paling indah. Terima kasih sudah hadir dalam
                hidupku! ✨</p>
            <button class="close-btn" id="closeBtn">Tutup ❤️</button>
        </div>
    </div>

    <script>
        // --- ANIMASI MASUK ---
        const textLove = "I Love You";
        const textName = "Nia Agustin";
        const loveEl = document.getElementById('typewriter-love');
        const nameEl = document.getElementById('typewriter-name');
        const photoBox = document.getElementById('photoBox');
        const envelopeBtn = document.getElementById('envelopeBtn');

        let lIdx = 0, nIdx = 0;

        function startSequence() {
            // 1. Tampilkan foto dulu dengan animasi pop-up
            photoBox.classList.add('show');

            // 2. Lanjut ketik "I Love You" setelah foto muncul
            setTimeout(typeLove, 800);
        }

        function typeLove() {
            if (lIdx < textLove.length) { loveEl.innerHTML += textLove.charAt(lIdx); lIdx++; setTimeout(typeLove, 140); }
            else { setTimeout(typeName, 300); }
        }

        function typeName() {
            if (nIdx < textName.length) { nameEl.innerHTML += textName.charAt(nIdx); nIdx++; setTimeout(typeName, 140); }
            else { setTimeout(() => envelopeBtn.classList.add('show'), 400); }
        }

        window.onload = () => { setTimeout(startSequence, 500); };

        // Musik & Modal Kontrol
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('musicBtn');
        const modal = document.getElementById('modal');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) { music.pause(); musicBtn.innerText = '🎵'; }
            else { music.play(); musicBtn.innerText = '🎶'; }
            isPlaying = !isPlaying;
        });

        envelopeBtn.addEventListener('click', () => modal.classList.add('open'));
        document.getElementById('closeBtn').addEventListener('click', () => modal.classList.remove('open'));

        // --- CANVAS ANIMASI BACKGROUND ---
        const canvasBg = document.getElementById('canvasBg');
        const ctxBg = canvasBg.getContext('2d');
        let w, h;
        function resizeBg() { w = canvasBg.width = window.innerWidth; h = canvasBg.height = window.innerHeight; }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        class Star {
            constructor() { this.x = Math.random() * w; this.y = Math.random() * h; this.size = Math.random() * 1.5; this.blinkSpeed = Math.random() * 0.05; this.opacity = Math.random(); }
            draw() { ctxBg.save(); ctxBg.globalAlpha = this.opacity; ctxBg.fillStyle = "#fff"; ctxBg.beginPath(); ctxBg.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctxBg.fill(); ctxBg.restore(); }
            update() { this.opacity += this.blinkSpeed; if (this.opacity > 1 || this.opacity < 0) this.blinkSpeed *= -1; }
        }

        const stars = Array.from({ length: 250 }, () => new Star());

        function animateBg() {
            let grad = ctxBg.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#000005'); grad.addColorStop(0.5, '#0d001a'); grad.addColorStop(1, '#1a002c');
            ctxBg.fillStyle = grad; ctxBg.fillRect(0, 0, w, h);
            stars.forEach(s => { s.update(); s.draw(); });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // --- CANVAS INTERAKSI KLIK & MOUSE ---
        const canvasInt = document.getElementById('canvasInteraction');
        const ctxInt = canvasInt.getContext('2d');
        let iw, ih;
        function resizeInt() { iw = canvasInt.width = window.innerWidth; ih = canvasInt.height = window.innerHeight; }
        window.addEventListener('resize', resizeInt);
        resizeInt();

        const mouseTrail = []; const bursts = [];
        const random = (min, max) => Math.random() * (max - min) + min;

        class TrailParticle {
            constructor(x, y) { this.x = x; this.y = y; this.size = random(1, 3); this.color = `hsl(${random(330, 360)}, 100%, 70%)`; this.opacity = 1; this.speedX = random(-0.5, 0.5); this.speedY = random(-0.5, 0.5); }
            update() { this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.02; }
            draw() { if (this.opacity <= 0) return; ctxInt.save(); ctxInt.globalAlpha = this.opacity; ctxInt.fillStyle = this.color; ctxInt.beginPath(); ctxInt.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctxInt.fill(); ctxInt.restore(); }
        }

        class BurstParticle {
            constructor(x, y, isHeart) {
                this.x = x; this.y = y; this.isHeart = isHeart; this.size = random(2, 5);
                this.color = `hsl(${random(320, 360)}, 100%, ${random(60, 80)}%)`;
                const angle = Math.random() * Math.PI * 2; const speed = random(2, 6);
                this.speedX = Math.cos(angle) * speed; this.speedY = Math.sin(angle) * speed;
                this.opacity = 1; this.gravity = 0.03; this.friction = 0.98;
            }
            update() { this.speedX *= this.friction; this.speedY *= this.friction; this.speedY += this.gravity; this.x += this.speedX; this.y += this.speedY; this.opacity -= 0.01; }
            draw() {
                if (this.opacity <= 0) return;
                if (this.isHeart) drawHeart(this.x, this.y, this.size * 2, this.color, this.opacity);
                else { ctxInt.save(); ctxInt.globalAlpha = this.opacity; ctxInt.fillStyle = this.color; ctxInt.beginPath(); ctxInt.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctxInt.fill(); ctxInt.restore(); }
            }
        }

        function drawHeart(x, y, size, color, alpha) {
            ctxInt.save(); ctxInt.globalAlpha = alpha; ctxInt.beginPath(); ctxInt.translate(x, y); ctxInt.scale(size / 10, size / 10); ctxInt.moveTo(0, 0);
            ctxInt.bezierCurveTo(-5, -5, -10, 0, -10, 5); ctxInt.bezierCurveTo(-10, 10, -5, 13, 0, 17); ctxInt.bezierCurveTo(5, 13, 10, 10, 10, 5); ctxInt.bezierCurveTo(10, 0, 5, -5, 0, 0);
            ctxInt.fillStyle = color; ctxInt.fill(); ctxInt.restore();
        }

        window.addEventListener('mousemove', e => { for (let i = 0; i < 2; i++) mouseTrail.push(new TrailParticle(e.clientX, e.clientY)); });
        window.addEventListener('touchmove', e => { for (let i = 0; i < 2; i++) mouseTrail.push(new TrailParticle(e.touches[0].clientX, e.touches[0].clientY)); });

        window.addEventListener('click', e => {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'IMG') return;
            for (let i = 0; i < 30; i++) bursts.push(new BurstParticle(e.clientX, e.clientY, i % 2 === 0));
        });

        function animateInteraction() {
            ctxInt.clearRect(0, 0, iw, ih);
            for (let i = mouseTrail.length - 1; i >= 0; i--) { mouseTrail[i].update(); mouseTrail[i].draw(); if (mouseTrail[i].opacity <= 0) mouseTrail.splice(i, 1); }
            for (let i = bursts.length - 1; i >= 0; i--) { bursts[i].update(); bursts[i].draw(); if (bursts[i].opacity <= 0) bursts.splice(i, 1); }
            requestAnimationFrame(animateInteraction);
        }
        animateInteraction();
    </script>
</body>

</html>
